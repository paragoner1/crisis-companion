[package]
name = "solana-sos"
version = "1.0.0"
edition = "2024"
authors = ["Paragoner <paragoner@solanasos.com>"]
description = "Voice-activated emergency response system for Solana Mobile - Reliability-first mobile safety app"
license = "Apache-2.0"
repository = "https://github.com/paragoner1/crisis-companion"
keywords = ["emergency", "voice", "solana", "mobile", "safety"]
categories = ["emergency", "voice-recognition", "blockchain"]

[lib]
name = "solana_sos"
crate-type = ["cdylib", "rlib"]

[features]
default = ["monitoring", "voice", "private", "audio"]
desktop = []
private = []
voice = [
    "nnnoiseless", 
    "cpal",
    "dep:ort",
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:ndarray"
]
voice-ort = ["dep:ort", "dep:ndarray"]
sensors = ["accelerometer"]
monitoring = ["tracing", "tracing-subscriber"]
audio = ["rodio", "tts"]
android = ["jni", "jni-sys", "ndk", "ndk-sys"]

[dependencies]
# ===== CORE MOBILE DEPENDENCIES =====
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "time", "fs"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.143"  # Updated to latest
anyhow = "1.0.89"
thiserror = "1.0.68"
log = "0.4.22"
env_logger = "0.11.8"  # Updated to latest

# ===== MOBILE DATABASE =====
rusqlite = { version = "0.37.0", features = ["bundled"] }  # Updated to latest stable

# ===== MOBILE SECURITY =====
ring = "0.17.14"  # Updated to latest
argon2 = "0.5.3"
aes-gcm = "0.10.3"

# ===== TIME & UTILITIES =====
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }  # Updated to latest
config = "0.15.15"  # Updated to latest
clap = { version = "4.5.46", features = ["derive"] }  # Updated to latest

# ===== JNI & ANDROID INTEGRATION =====
jni = { version = "0.21.1", optional = true }
jni-sys = { version = "0.4.0", optional = true }
ndk = { version = "0.9.0", optional = true }  # Updated to latest
ndk-sys = { version = "0.5.0", optional = true }

# ===== VOICE RECOGNITION & AUDIO =====
nnnoiseless = { version = "0.5.1", optional = true }
cpal = { version = "0.16.0", optional = true }  # Updated to latest
rodio = { version = "0.21.1", optional = true }  # Updated to latest
tts = { version = "0.25.0", optional = true }  # For offline TTS

# ===== SENSOR PROCESSING =====
accelerometer = { version = "0.12.0", optional = true }  # Latest

# ===== HTTP & NETWORKING (Mobile-optimized) =====
reqwest = { version = "0.12.23", features = ["json", "rustls-tls-webpki-roots"], default-features = false }  # Pure rustls, no OpenSSL

# ===== UTILITY DEPENDENCIES =====
rand = "0.9.2"  # Latest version - no conflicts with ORT
sha2 = "0.10.9"  # Updated to latest

# ===== SOLANA & BLOCKCHAIN =====
# Core Solana functionality - required for Mobile Wallet Adapter integration
solana-client = { version = "2.0.0", default-features = false }
solana-sdk = { version = "2.0.0", default-features = false, features = ["borsh", "full"] }
spl-token = { version = "8.0.0", default-features = false }
anchor-lang = { version = "0.31.1", default-features = false }
solana-program = "2.0"

# ===== MONITORING (Mobile-appropriate) =====
tracing = { version = "0.1.40", optional = true }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"], optional = true }

# ===== ON-DEVICE AI (Production-Ready ONNX Runtime) =====
ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = ["load-dynamic"] }
ndarray = { version = "0.16", optional = true }
hex = "0.4.3"
hf-hub = { version = "0.4.3", default-features = false, features = ["tokio"], optional = true }  # Model downloads, no OpenSSL
tokenizers = { version = "0.21.4", optional = true, default-features = false, features = ["fancy-regex"] }  # For T5 tokenization with performance optimizations
urlencoding = "2.1.3"

# Android-specific configuration
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
criterion = "0.7.0"  # Updated to latest
tokio-test = "0.4.4"
tempfile = "3.10.1"

[[bin]]
name = "solana-sos"
path = "src/main.rs"

[[bin]]
name = "demo_test"
path = "src/bin/demo_test.rs"

[[bin]]
name = "simple_perf_test"
path = "src/bin/simple_perf_test.rs"

# Removed candle_test - switched to ORT
